<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steps of Access</title>
  <link rel="stylesheet" href="style.css" />

  <!-- A-Frame + MindAR (image tracking) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <!-- Accessible UI overlay -->
  <div id="ui">
    <div id="card">
      <h1>Steps of Access</h1>
      <p id="bodyText">
        Point your camera at the marker near the steps to begin.
      </p>

      <div class="row">
        <label for="textSize">Text size</label>
        <input id="textSize" type="range" min="16" max="26" value="18" />
      </div>

      <div class="row">
        <button id="startBtn">Start</button>
        <button id="skipBtn" class="secondary">Skip to timeline</button>
      </div>
    </div>

    <div id="timeline" class="hidden" aria-live="polite"></div>
  </div>

  <!-- AR Scene -->
  <a-scene
    mindar-image="imageTargetSrc: targets/brookings.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <!-- Replace with your own images -->
      <img id="capitolSteps" src="assets/capitol-steps.jpg" />
      <img id="brookingsSteps" src="assets/brookings-steps.jpg" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Anchor content to the tracked image -->
    <a-entity id="anchor" mindar-image-target="targetIndex: 0">
      <!-- A “portal” plane that we can fade in/out -->
      <a-plane
        id="overlayPlane"
        src="#capitolSteps"
        position="0 0 0"
        height="1.2"
        width="1.8"
        material="transparent: true; opacity: 0.0;"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script src="app.js"></script>
</body>
</html>
