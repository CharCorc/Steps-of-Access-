<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steps of Access</title>
  <link rel="stylesheet" href="style.css" />

  <!-- A-Frame + MindAR (image tracking) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- forced stop caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>

<body>
  <!-- Accessible UI overlay -->
  <div id="ui">
  <!-- Welcome Screen -->
  <div id="welcomeModal" class="fullscreenModal">
    <div class="modalCard">
      <h1>Steps of Access</h1>
      <p id="welcomeText">
        This AR experience connects the history of the Capitol Crawl to the steps of Brookings Hall.
      </p>

      <div class="row">
        <label for="textSize">Text size</label>
        <input id="textSize" type="range" min="16" max="26" value="18" />
      </div>

      <div class="btnRow">
        <button id="startExperienceBtn">Start</button>
      </div>
    </div>
  </div>

  <!-- Story Screen -->
  <div id="storyModal" class="fullscreenModal hidden">
    <div class="modalCard">
      <div class="modalHeader">
        <h2 id="storyTitle">Story Title</h2>
      </div>

      <p id="storyBody"></p>

      <div class="modalFooter">
        <div id="storyProgress"></div>
        <div class="btnRow">
          <button id="storyBackBtn" class="secondary">← Back</button>
          <button id="skipToTimelineBtn" class="secondary">Skip to Timeline</button>
          <button id="storyNextBtn">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Timeline Screen -->
  <div id="timelineModal" class="fullscreenModal hidden" role="dialog" aria-modal="true" aria-labelledby="timelineTitle">
    <div class="modalCard">
      <div class="modalHeader">
        <h2 id="timelineTitle">1990 — Timeline Event</h2>
      </div>

      <p id="timelineBody"></p>

      <div class="modalFooter">
        <div id="timelineProgress"></div>
        <div class="btnRow">
          <button id="timelineBackBtn" class="secondary">← Back</button>
          <button id="timelineNextBtn">Next →</button>
        </div>
      </div>
    </div>
  </div>
</div>

  <!-- AR Scene -->
<a-scene
  id="scene"
  mindar-image="imageTargetSrc: targets/brookings.mind; autoStart: false; debugUIEnabled: true;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
    <a-assets>
      <!-- Replace with your own images -->
      <img id="capitolSteps" src="assets/capitol-steps.jpg" />
      <img id="brookingsSteps" src="assets/brookings-steps.jpg" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Anchor content to the tracked image -->
    <a-entity id="anchor" mindar-image-target="targetIndex: 0">
      <!-- A “portal” plane that we can fade in/out -->
      <a-plane
        id="overlayPlane"
        src="#capitolSteps"
        position="0 0 0"
        height="1.2"
        width="1.8"
        material="transparent: true; opacity: 0.0;"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script src="app.js"></script>
</body>
</html>
